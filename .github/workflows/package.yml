name: Package Extension

on:
  push:
    tags:
      - 'kees-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/kees-v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/kees-v}"
          else
            VERSION=$(jq -r '.version' extension/manifest.json)
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set manifest version and extension ID
        run: |
          jq '.version = "${{ steps.version.outputs.version }}" | .browser_specific_settings.gecko.id = "kees@kiwifarms.extension"' extension/manifest.json > tmp.json && mv tmp.json extension/manifest.json

      - name: Verify packaged paths exist
        run: |
          cd extension
          status=0
          for path in manifest.json src icons settings tags data; do
            if [ ! -e "$path" ]; then
              echo "::error::missing packaged path: extension/$path"
              status=1
            fi
          done
          # Every local file the manifest points at must be present, or the
          # build silently ships an extension with dead pages/resources.
          while read -r ref; do
            if [ ! -e "$ref" ]; then
              echo "::error::manifest references missing file: extension/$ref"
              status=1
            fi
          done < <(jq -r '
            [ .options_ui.page?,
              .background.service_worker?,
              (.background.scripts // [] | .[]),
              (.content_scripts // [] | .[] | (.js // [] | .[])),
              (.content_scripts // [] | .[] | (.css // [] | .[])),
              (.web_accessible_resources // [] | .[] | (.resources // [] | .[])),
              (.icons // {} | .[]),
              (.action.default_icon // {} | .[])
            ] | map(select(type == "string")) | unique | .[]' manifest.json)
          exit $status

      - name: Package extension
        run: |
          cd extension
          zip -r ../kees-${{ steps.version.outputs.version }}.zip \
            manifest.json \
            src/ \
            settings/ \
            tags/ \
            data/ \
            icons/ \
            -x '*/.*' '.*'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kees-${{ steps.version.outputs.version }}
          path: kees-${{ steps.version.outputs.version }}.zip

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/kees-v')
        uses: softprops/action-gh-release@v1
        with:
          files: kees-${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
